# Skills leaderboard manifest — seeded from docs/planning/3A-skills-leaderboard-plan.md (§2 shortlist, §3 task designs).
#
# Commits: full 40-hex pins of each repo's default-branch HEAD, retrieved from the
# GitHub API on 2026-11-12. Re-verify before any real batch; re-pin and re-run on drift.
# Licenses: verified via GitHub API / per-skill LICENSE files on 2026-11-11 (research doc).
#
# Rules encoded here:
#   - Every task has a DETERMINISTIC verifier criterion (file exists / tests pass /
#     lint holds / ffprobe / fixture-server / schema / string-match / structure).
#     Never an LLM judge.
#   - installs = skills.sh cumulative counters (2026-11-11). CONTEXT ONLY — never a
#     ranking key; the leaderboard orders by measured evidence.
#   - status: "designed" tasks are blueprints from the research doc (§3). Flip to
#     "implemented" only when workspaceSeed + verifier script + prompt exist on disk.
#   - needsNetwork: true = the task needs external network (package installs etc.);
#     the batch sandbox denies network for tasks that declare false.
#   - results: relative to this file; one JSONL row per run (or per recorded refusal).
manifestVersion: 1
