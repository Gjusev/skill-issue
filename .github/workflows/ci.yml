name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:cli
      # The real-agent smoke test (claude-code runner) is intentionally not
      # run in CI: it requires authentication and consumes model usage.
      # The browser e2e needs a local browser binary and is run locally.
